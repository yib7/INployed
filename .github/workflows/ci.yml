name: CI

on:
  push:
    # `autopilot/**` is here so a release-prep branch can prove itself on the Windows
    # and Linux runners before it reaches main, without opening a PR to trigger it.
    branches: [main, "autopilot/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    # Windows runner: this is a Windows desktop app (PySide6/Qt dashboard). The
    # Qt UI tests run headless via the offscreen platform plugin (see the test step).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      # pytest and the smoke test are SEPARATE steps on purpose: in one multi-line
      # PowerShell run block only the LAST command's exit code decides the step, so a
      # pytest failure followed by a passing smoke test went green (this actually
      # happened -- a hung test was killed by the timeout and CI still passed).
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen   # Qt UI tests run headless (no display on CI)
        # The per-test timeout lives in pyproject.toml (timeout = 120), so a hung test
        # fails fast with a thread dump everywhere, not just on CI.
        run: python -m pytest -q

      - name: Dashboard smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_qt.py

  # Linux is a second platform on purpose, but a deliberately narrower one. The README
  # claims Linux for the headless pipeline scripts only -- that is what runs on the
  # production GCP VM -- and does not claim the Qt dashboard there. So this job runs
  # ruff plus the test files covering pipeline/, and the platform claim gets evidence
  # matching its own scope rather than a broader green nothing in the docs actually
  # promises. None of these test files imports Qt.
  #
  # The rule for this list: a test file belongs here if it covers a module under
  # pipeline/ (or a script the VM runs) and does not import Qt. Two Qt-free files are
  # left out on purpose, so their absence does not read as an oversight:
  # tests/test_pipeline_dotenv_optout.py skips itself without a local .env, which is
  # always the CI case, so listing it would add a permanently-skipped test that looks
  # like coverage; tests/test_outbox.py covers local/outbox.py, the Windows side.
  pipeline-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # PySide6 is in requirements.txt and its wheel needs these shared objects to be
      # importable at all on a bare runner, even though this job never opens a window.
      - name: Install PySide6 system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run pipeline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/test_keypool.py \
            tests/test_merge_incoming.py \
            tests/test_run_scraper_script.py \
            tests/test_score_jobs.py \
            tests/test_score_jobs_chunked.py \
            tests/test_score_jobs_claude.py \
            tests/test_scraper_append.py \
            tests/test_scraper_bounds.py \
            tests/test_vm_sync.py

  # Runs the README's "Getting started" steps VERBATIM on a clean runner. This job
  # exists because a fresh-clone breakage slipped through once: the documented
  # `powershell -ExecutionPolicy Bypass -File scripts\setup.ps1` invocation failed on a
  # machine that had never run the project, while every convenient approximation of it
  # passed. Keep the commands below byte-identical to the README -- if the README
  # changes, change this job, not the other way around.
  readme-setup:
    runs-on: windows-latest
    steps:
      # README Step 1 is `git clone` + `cd`; checkout is the CI equivalent.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # README Step 2, verbatim.
      - name: README Step 2 - project venv and requirements
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install -r requirements.txt

      # README Step 3, verbatim -- the exact string a reader copy-pastes.
      - name: README Step 3 - scripts/setup.ps1
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1

      # Existence is not enough, and assuming it was hid a real bug for a whole
      # release: setup.ps1 wrote local/config.json with a BOM (PowerShell 5.1's
      # `Set-Content -Encoding UTF8`), json.loads rejects a leading BOM, and
      # jsonutil.read_json_dict swallowed the rejection into {} -- so on a fresh
      # install the app discarded every value the documented setup command had
      # just written, silently, with this step green. Load the file the way the
      # dashboard does, not just Test-Path it.
      - name: README Step 3 - the config files were written and load
        run: |
          $expected = @('.env', 'local/config.json', 'resume_tailor_files/master_experience.yaml')
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { throw "setup.ps1 did not create $f" }
          }
          Write-Host 'setup.ps1 wrote all three config files'
          $cfg = venv\Scripts\python.exe -c "import sys, json; sys.path.insert(0, 'local'); import jsonutil; d = jsonutil.read_json_dict('local/config.json'); print(json.dumps(d))"
          if ($LASTEXITCODE -ne 0) { throw 'could not load local/config.json' }
          Write-Host "read_json_dict(local/config.json) -> $cfg"
          if ($cfg -notmatch 'mtime_stable_seconds') {
            throw "the dashboard's own reader decoded the fresh config.json as $cfg -- setup.ps1 wrote something it cannot parse"
          }

      # README Step 4 is "double-click Open INployed Dashboard.cmd". The .cmd uses
      # `start`, which detaches, so running it alone proves the batch file parses and
      # resolves an interpreter but can NOT observe a crash inside the app. Both halves
      # are checked. The foreground run goes FIRST on purpose: app.main() holds a
      # single-instance lock, so a still-running detached instance from the .cmd step
      # would make this one exit immediately and turn the check into a false green.
      - name: README Step 4 - the dashboard starts and stays up
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $py = Join-Path $PWD 'venv\Scripts\python.exe'
          if (-not (Test-Path $py)) { throw "the venv from Step 2 is missing: $py" }
          $out = Join-Path $env:RUNNER_TEMP 'dash-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'dash-err.txt'
          $p = Start-Process -FilePath $py `
                 -ArgumentList 'local\open_dashboard.pyw' `
                 -PassThru -NoNewWindow `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          if ($p.WaitForExit(45000)) {
            Write-Host '--- stdout ---'; Get-Content $out -ErrorAction SilentlyContinue
            Write-Host '--- stderr ---'; Get-Content $err -ErrorAction SilentlyContinue
            throw "the dashboard exited on its own (exit code $($p.ExitCode)) -- a fresh clone cannot launch the app"
          }
          Write-Host 'dashboard still running after 45s; stopping it'
          Stop-Process -Id $p.Id -Force

      - name: README Step 4 - the .cmd launcher runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmd /c "Open INployed Dashboard.cmd"
          Start-Sleep -Seconds 20
          $alive = Get-Process -Name python, pythonw -ErrorAction SilentlyContinue
          if (-not $alive) { throw 'the .cmd launcher started no Python process' }
          Write-Host "launcher started: $($alive.Name -join ', ')"
          $alive | Stop-Process -Force
