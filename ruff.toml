# Ruff configuration. The rule selection is written down rather than inherited
# from ruff's built-in default, because that default is not stable across ruff
# minor releases: 0.16 widened it from the pycodestyle/pyflakes core to include
# pyupgrade, isort, flake8-bandit, flake8-datetimez and more, which turned one
# lint finding into 1278 overnight. Pinning the selection means a ruff upgrade
# changes how the same rules are enforced, not which rules exist, so CI and a
# fresh clone keep agreeing with each other.
#
# The set below is ruff's pre-0.16 default: pycodestyle errors (E4 imports,
# E7 statements, E9 syntax) plus all of pyflakes (F). Adding a rule family is a
# deliberate edit here, not a side effect of `pip install -U ruff`.

target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F"]
