<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply - Analytics Engineer - Fabrikam</title>
<!-- A synthetic replica of custom controls on an application form:
     a required consent drawn as a div with
     role=checkbox, an optional text-updates toggle drawn as role=switch,
     and a JazzHR-shaped resume question: its label names a file box hidden
     inside a ".none" wrapper that shows only after "Attach resume" is
     clicked. -->
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 12px 0; }
  label { display: block; }
  .none { display: none; }
  [role=checkbox], [role=switch] { display: inline-block; width: 18px; height: 18px;
    border: 1px solid #333; vertical-align: middle; margin-right: 6px; cursor: pointer; }
  [aria-checked=true] { background: #234; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Analytics Engineer</h1>
<form id="application" novalidate>
  <div class="field"><label for="first">First name *</label><input id="first" name="first" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field" id="resume-question">
    <label id="resume-label" for="resume-value">Resume<i class="asterisk">*</i></label>
    <div id="resume-options"><a id="choose-upload" href="#">Attach resume</a> or <a href="#">Paste resume</a></div>
    <div id="resume-upload-wrapper" class="none">
      <p>Attach a .pdf or .docx file.</p>
      <input type="file" id="resume-value" name="resume">
    </div>
  </div>
  <div class="field">
    <span role="checkbox" id="certify" aria-checked="false" aria-required="true" tabindex="0"
          aria-labelledby="certify-label"></span>
    <span id="certify-label">I certify that the information in this application is accurate *</span>
  </div>
  <div class="field">
    <span role="switch" id="texts" aria-checked="false" tabindex="0" aria-labelledby="texts-label"></span>
    <span id="texts-label">Send me updates about this application by text message</span>
  </div>
  <button type="submit" id="btn-submit">Submit application</button>
  <p id="problems" role="alert"></p>
</form>
<section id="thanks"><h2>Thank you for applying</h2><p>Your application has been received.</p></section>
<script>
  document.getElementById('choose-upload').addEventListener('click', function (e) {
    e.preventDefault();
    document.getElementById('resume-upload-wrapper').classList.remove('none');
  });
  document.querySelectorAll('[role=checkbox], [role=switch]').forEach(function (box) {
    box.addEventListener('click', function () {
      box.setAttribute('aria-checked', box.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    });
  });
  document.getElementById('application').addEventListener('submit', function (e) {
    e.preventDefault();
    var missing = [];
    if (!document.getElementById('first').value) missing.push('first name');
    if (!document.getElementById('email').value) missing.push('email');
    if (!document.getElementById('resume-value').files.length) missing.push('resume');
    if (document.getElementById('certify').getAttribute('aria-checked') !== 'true') missing.push('certification');
    if (missing.length) { document.getElementById('problems').textContent = 'Missing: ' + missing.join(', '); return; }
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('application').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
