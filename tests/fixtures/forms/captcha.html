<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Security check</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .widget { border: 1px solid #888; padding: 16px; width: 300px; }
  .brand { font-size: 12px; color: #555; margin-top: 8px; }
</style>
</head>
<body>
<h1>Verify you are human</h1>
<p>Complete the check below before continuing to the application.</p>
<div class="widget" id="captcha">
  <label><input type="checkbox" id="not_robot" name="not_robot"> I'm not a robot</label>
  <div class="brand">reCAPTCHA<br>Privacy - Terms</div>
</div>
</body>
</html>
