<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply for Analytics Engineer</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Apply for Analytics Engineer</h1>
<!-- The application after the email-first start and its code
     (email_code_first.html). -->
<div id="application">
  <label for="first_name">First name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last name *</label><input id="last_name" name="last_name" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <p><button type="button" id="btn-submit">Submit application</button></p>
</div>
<section id="thanks"><h2>Thank you for applying</h2><p>Your application was received.</p></section>
<script>
  document.getElementById('btn-submit').addEventListener('click', function () {
    var first = document.getElementById('first_name').value.trim();
    var last = document.getElementById('last_name').value.trim();
    if (!first || !last) { return; }
    document.body.dataset.submitted = '1';
    document.getElementById('application').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
