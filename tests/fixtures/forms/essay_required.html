<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product Analyst - Tailspin Toys</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 10px 0; }
  label { display: block; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Product Analyst</h1>
<p>Tailspin Toys, Denver, CO</p>
<div id="application">
  <div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="project">Describe a project you are proud of *</label><textarea id="project" name="project" rows="6" required maxlength="1500"></textarea></div>
  <button type="button" id="btn-submit">Submit</button>
</div>
<h2 id="thanks">Thank you for applying</h2>
<script>
  document.getElementById('btn-submit').addEventListener('click', function () {
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('application').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
