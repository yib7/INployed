<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply for Analytics Engineer</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
</style>
</head>
<body>
<h1>Apply for Analytics Engineer</h1>
<!-- Final review A-C1: a real form post. The server counts it as the send and
     answers with no redirect: a page that says a link to confirm the
     application was emailed (link_sent.html). Loading that page again would
     post the application a second time. -->
<form id="application" method="post" action="/submit/link_after_submit">
  <label for="first_name">First name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <p><button type="submit" id="btn-submit">Submit application</button></p>
</form>
</body>
</html>
