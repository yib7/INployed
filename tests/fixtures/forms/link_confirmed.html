<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Application confirmed</title>
<!-- The page the emailed link opens: with a token the
     application the site held for the link is received. -->
<style> body { font-family: sans-serif; margin: 24px; } </style>
</head>
<body>
<h1 id="title">Confirming...</h1>
<p id="note"></p>
<script>
  var ok = /[?&]token=[0-9a-f]{8,}/.test(location.search);
  if (ok) {
    document.getElementById('title').textContent = 'Your application has been received.';
    document.getElementById('note').textContent = 'The hiring team will review it and reach out if there is a match.';
  } else {
    document.getElementById('title').textContent = 'This link is invalid.';
  }
</script>
</body>
</html>
