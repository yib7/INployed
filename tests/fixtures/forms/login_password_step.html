<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in - Fabrikam Careers</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
</style>
</head>
<body>
<!-- The second step of the two-step sign-in: the password for the account
     whose address went in on the screen before. -->
<h1>Sign in to continue your application</h1>
<p>Enter the password for your existing account.</p>
<div id="login">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password">
  <p><button type="button" id="btn-signin">Sign in</button></p>
</div>
<script>
  document.getElementById('btn-signin').addEventListener('click', function () {
    if (!document.getElementById('password').value) { return; }
    window.location.href = 'ashby_steps.html';
  });
</script>
</body>
</html>
