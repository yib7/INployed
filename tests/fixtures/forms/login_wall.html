<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in - Fabrikam Careers</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
</style>
</head>
<body>
<h1>Sign in to continue your application</h1>
<p>Use the account you created for Fabrikam Careers.</p>
<div id="login">
  <label for="login_email">Email</label><input id="login_email" name="email" type="email" autocomplete="username">
  <label for="login_password">Password</label><input id="login_password" name="password" type="password" autocomplete="current-password">
  <p><button type="button" id="btn-signin">Sign in</button></p>
  <p><a href="signup.html">Create an account</a></p>
</div>
<script>
  document.getElementById('btn-signin').addEventListener('click', function () {
    if (!document.getElementById('login_password').value) { return; }
    document.body.setAttribute('data-logged-in', '1');
    window.location.href = 'ashby_steps.html';
  });
</script>
</body>
</html>
