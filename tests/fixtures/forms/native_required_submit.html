<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Engineer - Tailspin Toys</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 10px 0; }
  label { display: block; }
  .editor { border: 1px solid #999; min-height: 80px; padding: 6px; }
  #received { display: none; }
</style>
</head>
<body>
<h1>Data Engineer</h1>
<p>Tailspin Toys, Denver, CO</p>
<!-- A rich-text box writes into a hidden required textarea: HTML5 validation
     blocks the send while it is empty, the browser shows its bubble, and the
     page itself does not change. -->
<form id="application">
  <div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field">
    <div id="cover-label">Cover letter *</div>
    <div class="editor" contenteditable="true" aria-labelledby="cover-label"></div>
    <textarea name="cover_letter" aria-label="Cover letter" required style="display:none"></textarea>
  </div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
<section id="received">
  <h2>Application received</h2>
  <p>Thank you for applying.</p>
</section>
<script>
  document.getElementById('application').addEventListener('submit', function (ev) {
    ev.preventDefault();
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('application').style.display = 'none';
    document.getElementById('received').style.display = 'block';
  });
</script>
</body>
</html>
