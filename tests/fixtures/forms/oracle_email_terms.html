<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analytics Engineer - Fabrikam Careers - Apply</title>
<!-- A synthetic replica of an Oracle Recruiting Cloud first screen (layout
     study G3, G6): an email box, a required terms checkbox drawn at 0 x 0
     with opacity 0 and a clip behind its visible custom label, a honeypot
     box off the page, NEXT; then the application's own step and its
     Submit on the same URL. -->
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 12px 0; }
  label { display: block; }
  .apply-flow-input-checkbox { position: absolute; width: 0; height: 0; opacity: 0;
                               clip: rect(0 0 0 0); margin: 0; }
  .apply-flow-input-checkbox + label::before { content: ''; display: inline-block; width: 14px;
    height: 14px; border: 1px solid #333; margin-right: 6px; vertical-align: middle; }
  .apply-flow-input-checkbox:checked + label::before { background: #333; }
  .honey { position: absolute; left: -9999px; top: 0; }
  .step { display: none; }
  .step.active { display: block; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Analytics Engineer</h1>
<div class="step active" id="step-email">
  <h2>Apply for this role</h2>
  <p>Enter your email to begin.</p>
  <div class="field"><label for="primary-email">Email Address *</label>
    <input id="primary-email" type="email" name="email" required></div>
  <div class="honey"><label for="honey-pot-1">honeypot</label><input id="honey-pot-1" name="honey" type="text"></div>
  <div class="field">
    <input type="checkbox" id="legal-disclaimer" class="apply-flow-input-checkbox" required>
    <label for="legal-disclaimer">I agree with the terms and conditions of the application</label>
  </div>
  <button type="button" id="next" class="button--primary">NEXT</button>
</div>
<div class="step" id="step-form">
  <h2>Contact information</h2>
  <p>Step 1 of 1</p>
  <div class="field"><label for="first-name">First Name *</label><input id="first-name" type="text" required></div>
  <div class="field"><label for="last-name">Last Name *</label><input id="last-name" type="text" required></div>
  <div class="field"><label for="phone">Phone Number</label><input id="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume *</label><input id="resume" type="file" required></div>
  <button type="button" id="btn-submit" class="button--primary">Submit</button>
</div>
<section id="thanks"><h2>Thank you for applying</h2><p>Your application was received.</p></section>
<script>
  document.getElementById('next').addEventListener('click', function () {
    if (document.getElementById('honey-pot-1').value) document.body.setAttribute('data-bot', '1');
    if (!document.getElementById('primary-email').value || !document.getElementById('legal-disclaimer').checked) return;
    document.getElementById('step-email').classList.remove('active');
    document.getElementById('step-form').classList.add('active');
  });
  document.getElementById('btn-submit').addEventListener('click', function () {
    if (!document.getElementById('first-name').value || !document.getElementById('resume').files.length) return;
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('step-form').classList.remove('active');
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
