<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create an account - Fabrikam Careers</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
  .rules { color: #555; font-size: 13px; }
</style>
</head>
<body>
<!-- A sign-up that states its password rules beside the box and
     refuses a password that misses one (the boxes emptied, the rule named).
     The harness's synthetic password meets them. -->
<h1>Create an account</h1>
<p>An account lets you track the status of your application.</p>
<label for="signup_email">Email</label><input id="signup_email" name="email" type="email" autocomplete="username">
<label for="signup_password">Password</label><input id="signup_password" name="password" type="password" autocomplete="new-password" aria-describedby="rules">
<p class="rules" id="rules">Your password must be 12 to 64 characters long and include an uppercase letter, a lowercase letter, a number and a special character.</p>
<label for="signup_confirm">Confirm password</label><input id="signup_confirm" name="password_confirmation" type="password" autocomplete="new-password">
<p id="error" role="alert" style="display: none"></p>
<p><button type="button" id="btn-create">Create account</button></p>
<p>Already have an account? <a href="login_wall.html">Sign in</a></p>
<script>
  document.getElementById('btn-create').addEventListener('click', function () {
    var p = document.getElementById('signup_password').value;
    var why = '';
    if (p.length < 12 || p.length > 64) why = 'Password must be 12 to 64 characters.';
    else if (!/[A-Z]/.test(p) || !/[a-z]/.test(p)) why = 'Password needs an uppercase and a lowercase letter.';
    else if (!/[0-9]/.test(p)) why = 'Password needs a number.';
    else if (!/[^A-Za-z0-9]/.test(p)) why = 'Password needs a special character.';
    else if (p !== document.getElementById('signup_confirm').value) why = 'Passwords do not match.';
    if (why || !document.getElementById('signup_email').value) {
      document.getElementById('signup_password').value = '';
      document.getElementById('signup_confirm').value = '';
      var err = document.getElementById('error');
      err.textContent = why || 'Enter your email.';
      err.style.display = 'block';
      return;
    }
    window.location.href = 'lever_single.html';
  });
</script>
</body>
</html>
