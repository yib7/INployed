<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analytics Engineer - Fabrikam</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0; }
  input { display: block; margin-top: 2px; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Analytics Engineer</h1>
<p>Fabrikam, Remote</p>
<!--
  A Submit that stays disabled until the optional referral
  code holds a value, so the run pauses at the disabled way on. The query
  string adds what the person does in the browser while the run waits:
  ?click=1 types the referral code, then clicks the Submit it enables (the
  person sent the application during the pause, marked
  data-person-submitted: the harness counts the run's sends); ?reformat=1
  types the referral code and rewrites the phone the run typed in the
  site's own format (the person's fix).
  With ?click=1, ?account=1 swaps the thank-you page for an
  account form that shares the "Email" label and shows no received words
  (the send button gone reads as possibly sent); ?wizard=1 makes
  the disabled control a Next, and the person's click moves the address on
  to a review step with its own Submit (the run plans the new
  step, then the gate sends).
  With ?wizard=1, ?again=1 gives the review step its own
  optional "Referral code" box, named as the first step's: an answer the
  person gave in the card for the first step never goes in it. The script
  adds the box on the click, so a page without ?again=1 reads as before and
  its recorded replay keys still match.
-->
<form id="application" onsubmit="return false">
  <label>Full name * <input name="name" type="text" required></label>
  <label>Email * <input name="email" type="email" required></label>
  <label>Phone * <input name="phone" type="tel" required></label>
  <label>Referral code <input name="referral" id="referral" type="text"></label>
  <button type="button" id="btn-submit" disabled>Submit application</button>
</form>
<h2 id="thanks">Thank you for applying</h2>
<section id="account" hidden>
  <h2>Save your details for next time</h2>
  <label>Email * <input name="account_email" type="email"></label>
  <label>Password * <input name="account_password" type="password"></label>
  <button type="button" id="btn-account">Create account</button>
</section>
<section id="review" hidden>
  <h2>Review your details</h2>
  <p>Check your answers before you send them.</p>
  <button type="button" id="btn-final">Submit application</button>
</section>
<script>
  const params = new URLSearchParams(location.search);
  const form = document.getElementById('application');
  const button = document.getElementById('btn-submit');
  const referral = document.getElementById('referral');
  const PERSON_PHONE = '+1 (555) 555-0100';
  if (params.get('wizard')) button.textContent = 'Next';
  const sync = () => { button.disabled = !referral.value; };
  referral.addEventListener('input', sync);
  const set = (el, value) => {
    el.value = value;
    el.dispatchEvent(new Event('input', {bubbles: true}));
    el.dispatchEvent(new Event('change', {bubbles: true}));
  };
  let done = false;
  let person = false;
  const outlined = (el) => (el.style.outline || '').indexOf('217, 119, 6') >= 0;
  new MutationObserver(() => {
    if (done || !outlined(referral)) return;
    done = true;
    if (params.get('click') || params.get('reformat')) set(referral, 'FRIEND-7');
    if (params.get('reformat')) {
      const phone = form.elements.phone;
      set(phone, PERSON_PHONE);
      // the run typing over the person's fix marks the page
      phone.addEventListener('input', () => {
        if (phone.value !== PERSON_PHONE) document.body.setAttribute('data-phone-retyped', '1');
      });
    }
    if (params.get('click')) {
      // the person's own click: marked apart from a run's send
      person = true;
      button.click();
      person = false;
    }
  }).observe(document.body, {attributes: true, attributeFilter: ['style'], subtree: true});
  button.addEventListener('click', function () {
    if (button.disabled) return;
    form.style.display = 'none';
    if (params.get('wizard')) {
      history.pushState({}, '', location.pathname + location.search + '&step=2');
      document.getElementById('review').hidden = false;
      if (params.get('again')) {
        const again = document.createElement('label');
        again.id = 'again';
        again.innerHTML = 'Referral code <input name="referral" type="text">';
        document.getElementById('btn-final').before(again);
      }
      return;
    }
    document.body.setAttribute(person ? 'data-person-submitted' : 'data-submitted', '1');
    if (params.get('account')) {
      document.getElementById('account').hidden = false;
      return;
    }
    document.getElementById('thanks').style.display = 'block';
  });
  document.getElementById('btn-final').addEventListener('click', function () {
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('review').hidden = true;
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
