<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Platform Engineer - Wide World Importers</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 10px 0; }
  label { display: block; }
</style>
</head>
<body>
<h1>Platform Engineer</h1>
<p>Wide World Importers, Seattle, WA</p>
<h2>Submit your application</h2>
<!-- A real form post: the harness server counts it as the send and answers
     with the confirmation page. -->
<form id="application" method="post" action="/submit/post_form" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required accept=".pdf"></div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
</body>
</html>
