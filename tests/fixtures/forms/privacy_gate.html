<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy Agreement - Northwind Careers</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
  #form { display: none; }
</style>
</head>
<body>
<!-- A privacy agreement as the application's first screen (a
     Taleo shape): accepted, it opens the form; declined, it ends the
     application. -->
<div id="agreement">
  <h1>Privacy Agreement</h1>
  <p>Before you apply, read how Northwind uses the information in your application. We keep it
     for the hiring process and delete it after two years.</p>
  <button type="button" id="btn-accept">I Accept</button>
  <button type="button" id="btn-decline">I Decline</button>
</div>
<div id="form">
  <h1>Apply for Data Engineer</h1>
  <label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <p><button type="button" id="btn-submit">Submit application</button></p>
</div>
<section id="received" style="display:none">
  <h2>Application received</h2>
  <p>Thank you for applying.</p>
</section>
<script>
  document.getElementById('btn-accept').addEventListener('click', function () {
    document.getElementById('agreement').style.display = 'none';
    document.getElementById('form').style.display = 'block';
  });
  document.getElementById('btn-decline').addEventListener('click', function () {
    document.body.innerHTML = '<h1>You declined the privacy agreement.</h1>';
  });
  document.getElementById('btn-submit').addEventListener('click', function () {
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('form').style.display = 'none';
    document.getElementById('received').style.display = 'block';
  });
</script>
</body>
</html>
