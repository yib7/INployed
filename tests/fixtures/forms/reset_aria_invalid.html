<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud Engineer - Fourth Coffee</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 10px 0; }
  label { display: block; }
  .mat-error { color: #b00; }
</style>
</head>
<body>
<h1>Cloud Engineer</h1>
<p>Fourth Coffee, Seattle, WA</p>
<!-- An Angular Material shape: the submit posts by fetch (the flow server
     counts it), then resets the form; the form stays "submitted", so every
     emptied required field shows aria-invalid and its message. -->
<form id="application">
  <div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required aria-describedby="first_name-error"><span class="mat-error" id="first_name-error" hidden>This field is required.</span></div>
  <div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required aria-describedby="last_name-error"><span class="mat-error" id="last_name-error" hidden>This field is required.</span></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required aria-describedby="email-error"><span class="mat-error" id="email-error" hidden>This field is required.</span></div>
  <button type="button" id="btn-submit">Submit application</button>
</form>
<script>
  document.getElementById('btn-submit').addEventListener('click', function () {
    fetch('/submit/reset_aria_invalid', {method: 'POST', body: '{}'}).then(function () {
      document.getElementById('application').reset();
      document.querySelectorAll('#application input[required]').forEach(function (el) {
        el.setAttribute('aria-invalid', 'true');
        document.getElementById(el.id + '-error').hidden = false;
      });
    });
  });
</script>
</body>
</html>
