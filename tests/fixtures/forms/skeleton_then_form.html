<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply - Adatum</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  label { display: block; margin: 10px 0 2px; }
  .skeleton-line { height: 14px; background: #ddd; margin: 8px 0; width: 70%; }
</style>
</head>
<body>
<!-- NAV-04 / READ-02: an application that shows a loading skeleton
     (aria-busy, skeleton blocks, a Cancel), then the form. A read of the
     skeleton is no read of the page. The skeleton stays until the page has
     been read once (the harness calls `__appRead` after each read: the
     flow's `on_read`), then the form comes 800 ms later; with `?clear=now`
     it comes during that first read, between the read and anything after
     it. With no reader the form comes after a minute. -->
<div id="app" aria-busy="true">
  <p>Loading your application. This can take a few seconds while we fetch the questions for this
     role, your saved answers and the documents you uploaded before. Please keep this window open;
     closing it now would lose the answers you have not saved yet.</p>
  <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div>
  <button type="button" id="cancel">Cancel</button>
</div>
<script>
  var shown = false;
  function show() {
    if (shown) return;
    shown = true;
    var app = document.getElementById('app');
    app.removeAttribute('aria-busy');
    app.innerHTML = '<h1>Apply for Business Analyst</h1>'
      + '<label for="first_name">First name *</label><input id="first_name" name="first_name" required>'
      + '<label for="email">Email *</label><input id="email" name="email" type="email" required>'
      + '<p><button type="button" id="btn-submit">Submit application</button></p>';
    document.getElementById('btn-submit').addEventListener('click', function () {
      document.body.setAttribute('data-submitted', '1');
      app.innerHTML = '<h2 id="received">Application received</h2><p>Thank you for applying.</p>';
    });
  }
  var read = false;
  window.__appRead = function () {
    if (read) return;
    read = true;
    if (/[?&]clear=now\b/.test(location.search)) show();
    else setTimeout(show, 800);
  };
  setTimeout(show, 60000);
</script>
</body>
</html>
