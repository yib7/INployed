<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reporting Analyst - Adventure Works</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 10px 0; }
  label { display: block; }
</style>
</head>
<body>
<h1>Reporting Analyst</h1>
<p>Adventure Works, Portland, OR</p>
<!-- A native form post whose answer takes 8 s (a large upload on a slow
     server): the flow server counts the post and answers with the
     confirmation once the wait is over. -->
<form id="application" method="post" action="/submit/slow_post" enctype="multipart/form-data">
  <div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required></div>
  <div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required accept=".pdf"></div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
</body>
</html>
