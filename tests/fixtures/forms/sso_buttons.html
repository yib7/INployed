<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in - Fabrikam Careers</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  header { display: flex; gap: 12px; padding: 12px 24px; background: #eef; }
  main { margin: 24px; }
  main button { display: block; margin: 10px 0; padding: 8px 16px; }
</style>
</head>
<body>
<!-- A portal whose only way on is a sign-in with another site's
     account. The run never takes one: a click on any of them marks the body. -->
<header><a href="#">Fabrikam Careers</a><a href="#">Help</a></header>
<main>
  <h1>Sign in to apply</h1>
  <p>Use your work or personal account to continue your application for Analytics Engineer.</p>
  <button type="button" data-sso="google">Sign in with Google</button>
  <button type="button" data-sso="microsoft">Sign in with Microsoft</button>
  <button type="button" data-sso="linkedin">Continue with LinkedIn</button>
  <button type="button" data-sso="apple">Sign in with Apple</button>
  <p>By signing in you agree to our Terms of Use.</p>
</main>
<script>
  document.querySelectorAll('[data-sso]').forEach(function (b) {
    b.addEventListener('click', function () { document.body.setAttribute('data-sso-used', b.dataset.sso); });
  });
</script>
</body>
</html>
