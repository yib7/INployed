<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply - Analytics Engineer - Fabrikam</title>
<!-- A synthetic page with two buttons that read "Submit" (SP6 review I2): a
     talent-community box above the application, whose own "Submit" sends
     only the talent sign-up, and the application form, whose "Submit"
     refuses a blank "Portfolio URL" in its own script, nothing sent, the
     message beside the box. After the repair the application's own Submit
     is the one clicked again; the talent box is never sent. -->
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 12px 0; }
  .field > label { display: block; font-weight: bold; }
  .error { color: #b00; }
  aside { border: 1px solid #aaa; padding: 12px; margin-bottom: 24px; width: 360px; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Analytics Engineer</h1>
<p>Fabrikam, New York, NY</p>
<aside>
  <form id="talent">
    <p>Hear about new roles first: join our talent community.</p>
    <label for="temail">Your email</label><input id="temail" name="talent_email" type="email">
    <button type="submit" id="talent-submit">Submit</button>
  </form>
</aside>
<form id="application" novalidate>
  <div class="field"><label for="first">First name *</label><input id="first" name="first_name" type="text" required></div>
  <div class="field"><label for="last">Last name *</label><input id="last" name="last_name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="resume">Resume *</label><input id="resume" name="resume" type="file" required></div>
  <div class="field"><label for="portfolio">Portfolio URL</label>
    <input id="portfolio" name="portfolio" type="url">
    <div class="error portfolio-error"></div></div>
  <button type="submit" id="btn-submit">Submit</button>
</form>
<section id="thanks"><h2>Application received</h2><p>Thank you for applying.</p></section>
<script>
  function $(id) { return document.getElementById(id); }
  $('talent').addEventListener('submit', function (e) {
    e.preventDefault();
    document.body.setAttribute('data-talent-sent', '1');
    $('talent').innerHTML = '<p>You joined our talent community.</p>';
  });
  $('application').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!$('portfolio').value) {
      document.querySelector('.portfolio-error').textContent = 'Portfolio URL is required';
      return;
    }
    document.body.setAttribute('data-submitted', '1');
    $('application').style.display = 'none';
    $('thanks').style.display = 'block';
  });
</script>
</body>
</html>
