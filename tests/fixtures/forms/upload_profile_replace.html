<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply - Platform Engineer - Fabrikam</title>
<!-- A synthetic returning candidate's page: the resume
     box shows the resume kept from an earlier application, under the same
     file name every tailored resume carries. The widget replaces the kept
     chip with the new file's chip and resets its input, so the name shows
     as often as before and no success note appears; the page counts this
     application's uploads (data-uploads). -->
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 12px 0; }
  .field label { display: block; font-weight: bold; }
  .chip { display: inline-block; background: #e6eef8; border-radius: 12px; padding: 2px 10px; margin: 4px; }
  #thanks { display: none; }
</style>
</head>
<body>
<h1>Platform Engineer</h1>
<p>Fabrikam, Austin, TX</p>
<p>Welcome back. We filled in your profile from your last application.</p>
<form id="application" novalidate>
  <div class="field"><label for="name">Full name *</label><input id="name" name="name" type="text" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field" id="resume-field">
    <label for="resume">Resume *</label>
    <div id="chips"><span class="chip">Jane_Doe_Resume.pdf (uploaded 2026-08-02)</span></div>
    <input id="resume" type="file">
  </div>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
<section id="thanks"><h2>Application received</h2><p>Thank you for applying.</p></section>
<script>
  var input = document.getElementById('resume');
  var uploads = 0;
  input.addEventListener('change', function () {
    uploads += input.files.length;
    document.body.setAttribute('data-uploads', String(uploads));
    document.getElementById('chips').innerHTML = '<span class="chip">' + input.files[0].name + '</span>';
    input.value = '';
  });
  document.getElementById('application').addEventListener('submit', function (e) {
    e.preventDefault();
    document.body.setAttribute('data-submitted', '1');
    document.getElementById('application').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
  });
</script>
</body>
</html>
