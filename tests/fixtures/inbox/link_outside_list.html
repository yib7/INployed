<!doctype html>
<html lang="en" data-provider="outlook">
<title>Inbox</title>
<body>
<!-- ACC-05: the account check's link goes through a mail tracker on another
     host; the run never opens it. -->
<div role="listbox" aria-label="Message list">

<div role="option" onclick="location.href='link_outside_message.html'">
<span data-testid="sender">fabrikam@myworkday.com</span>
<span data-testid="subject">Fabrikam: verify your candidate account</span>
<span data-testid="preview">Message sent by Workday for Fabrikam. Open the link below to verify your email address and activate your account.</span></div>

<div role="option" onclick="location.href='plain_message.html'">
<span data-testid="sender">newsletter@weekly.example</span>
<span data-testid="subject">This week in analytics</span>
<span data-testid="preview">Five charts worth a second look.</span></div>

</div></body></html>
